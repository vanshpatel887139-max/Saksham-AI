# Secret scanning, enforced in CI.
#
# This exists because the local hooks are opt-in: .githooks/pre-commit needs
# `git config core.hooksPath .githooks`, and .pre-commit-config.yaml needs
# `pre-commit install`. Neither was ever activated, so a key could have been
# committed with nothing watching. This job runs for every push and pull
# request regardless of how anyone's machine is set up.
#
# The .githooks hook is still the more important of the two: it blocks the
# commit before the value ever lands in history, whereas this only reports
# after. Keep both.
#
# What this does NOT do: un-leak a secret. A credential caught here is already
# in git history and must be rotated -- deleting the line does not help. See
# "Git History" in README.md.
name: secret-scan

on:
  push:
    branches: ['**']
  pull_request:
  # Lets someone who pushes straight to a branch find out here instead of
  # waiting for a PR review.
  workflow_dispatch:

# Reading the repository is all this job needs.
permissions:
  contents: read

# A newer push supersedes an in-flight scan for the same ref.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 pulls the entire history. With the default shallow
          # depth a secret committed months ago is simply not present to scan,
          # so the job would report clean on a repository that had already
          # leaked one.
          fetch-depth: 0

      - name: Scan working tree and full history
        uses: gitleaks/gitleaks-action@v2
        with:
          # Point at our config rather than accepting the action's defaults.
          # The stock ruleset was measured and abandoned: its bundled global
          # allowlist silently suppressed custom rules, and it misses the four
          # shapes that matter here (postgres URIs with inline passwords,
          # sb_secret_ keys, gsk_ Groq keys, AWS key ids). Rationale and the
          # measured comparison live in .gitleaks.toml.
          config_path: .gitleaks.toml
          # --redact so a hit names the rule and file without printing the
          # value into the Actions log, which is readable by anyone with repo
          # access and is itself a disclosure channel.
          # --log-opts="--all" so every commit is scanned, not just the tip.
          # --exit-code=1 so a finding fails the job rather than only warning.
          args: >
            --config=.gitleaks.toml
            --redact
            --no-banner
            --exit-code=1
            --verbose
            --log-opts="--all"
          #
          # There is deliberately no `exclude_paths` here.
          #
          # The two known exemptions -- `Demo@1234` and the .env.example
          # template -- are allowlisted in .gitleaks.toml, and `config_path`
          # makes the action honour them.
          #
          # exclude_paths would be the wrong tool: it exempts a whole path with
          # no regard for what matched, which is exactly the bug the config
          # allowlist was fixed for. Using it here would make this job
          # strictly weaker than the local hook it backs up. Keep the
          # exemptions in the config, where they are value-scoped and
          # reviewable.
      # If this job ever blocks a legitimate change, add a narrow, commented
      # allowlist entry to .gitleaks.toml. Never widen the scan to make a
      # build pass, and never disable the job.
